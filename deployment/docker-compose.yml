version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: diy_store_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diy_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-diy_store}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diy_user} -d ${POSTGRES_DB:-diy_store}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    container_name: diy_store_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-diy_user}:${POSTGRES_PASSWORD:-diy_secret_password}@db:5432/${POSTGRES_DB:-diy_store}
      SECRET_KEY: ${SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    container_name: diy_store_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
    driver: local
  backend_uploads:
    driver: local
